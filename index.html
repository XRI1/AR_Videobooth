<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0a1aa6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Gut Synbio · AR Booth</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="stage"></canvas>

  <!-- Start / loading screen -->
  <section id="intro" class="overlay brand-bg">
    <div class="intro-card">
      <img class="brand-logo" src="./brand/logo.webp" alt="Gut Synbio — Activating growth through synbiotic science" />
      <h1 class="intro-title">AR 360° Video Booth</h1>
      <p class="intro-sub">Step into the frame, lock the scene and record your synbiotic moment.</p>
      <button id="btnStart" class="btn-primary btn-start">Start AR Camera</button>
      <p><label class="link-btn">or use a video file<input id="fileSource" type="file" accept="video/*" hidden /></label></p>
      <p id="introStatus" class="muted"></p>
    </div>
  </section>

  <!-- HUD -->
  <header id="hud-top" class="hud hidden">
    <button id="btnSettings" class="icon-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7Zm7.43-2.53a7.8 7.8 0 0 0 0-1.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.3 7.3 0 0 0-1.68-.97l-.36-2.54A.5.5 0 0 0 14.05 2h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.6.24-1.17.57-1.68.97l-2.39-.96a.5.5 0 0 0-.61.22L2.76 8.51a.5.5 0 0 0 .12.64l2.03 1.58a7.8 7.8 0 0 0 0 1.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.61.22l2.39-.96c.51.4 1.08.73 1.68.97l.36 2.54c.04.24.25.42.49.42h3.84c.24 0 .45-.18.49-.42l.36-2.54c.6-.24 1.17-.57 1.68-.97l2.39.96c.22.08.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58Z"/></svg>
    </button>
    <div id="trackPill" class="pill">Loading…</div>
    <div class="hud-right">
      <button id="btnLock" class="icon-btn hidden" title="Lock text in place" aria-label="Lock text in place" aria-pressed="false">
        <svg class="icon-unlocked" viewBox="0 0 24 24"><path d="M12 17a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm6-9h-8V6a2 2 0 0 1 4 0h2a4 4 0 0 0-8 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2Zm0 12H6V10h12Z"/></svg>
        <svg class="icon-locked" viewBox="0 0 24 24"><path d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2Zm-6 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm3.1-9H8.9V6a3.1 3.1 0 0 1 6.2 0Z"/></svg>
      </button>
      <button id="btnGyro" class="icon-btn" title="360° gyro lock" aria-label="Toggle 360 gyro lock">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8Zm3.5-12.5-5 2-2 5 5-2Zm-3.5 5.5a1 1 0 1 1 1-1 1 1 0 0 1-1 1Z"/></svg>
      </button>
      <button id="btnFlip" class="icon-btn" title="Switch camera" aria-label="Switch camera">
        <svg viewBox="0 0 24 24"><path d="M20 5h-3.2L15 3H9L7.2 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2Zm-8 13a5 5 0 0 1-4.9-4H5l3-3 3 3H9.2A3 3 0 0 0 15 13h2a5 5 0 0 1-5 5Zm4-5-3-3h1.8A3 3 0 0 0 9 11H7a5 5 0 0 1 9.9 1H19Z"/></svg>
      </button>
    </div>
  </header>

  <footer id="hud-bottom" class="hud hidden">
    <button id="btnPhoto" class="icon-btn big" title="Take photo" aria-label="Take photo">
      <svg viewBox="0 0 24 24"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3Zm3 15a5 5 0 1 1 5-5 5 5 0 0 1-5 5Zm0-2a3 3 0 1 0-3-3 3 3 0 0 0 3 3Z"/></svg>
    </button>
    <div class="rec-wrap">
      <button id="btnRecord" class="rec-btn" aria-label="Record"><span></span></button>
      <div id="recTime" class="rec-time">00:00</div>
    </div>
    <button id="btnFx" class="icon-btn big" title="Fire fireworks now" aria-label="Fire fireworks">
      <svg viewBox="0 0 24 24"><path d="M12 2l1.6 5.2L19 5l-3.2 4.6L21 12l-5.2 1.6L19 19l-4.6-3.2L12 22l-1.6-5.2L5 19l3.2-4.6L3 12l5.2-1.6L5 5l4.6 3.2Z"/></svg>
    </button>
  </footer>

  <!-- Settings drawer -->
  <aside id="settings" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2>Scene settings</h2>
      <button id="btnCloseSettings" class="icon-btn" aria-label="Close settings">✕</button>
    </div>
    <div class="drawer-body">
      <fieldset>
        <legend><label><input type="checkbox" data-key="ring1.enabled" /> Main text ring</label></legend>
        <label class="check"><input type="checkbox" data-key="ring1.logoText" /> Brand 3D lettering "gut SYNBIO"</label>
        <label>Text (when brand lettering is off) <input type="text" data-key="ring1.text" maxlength="40" /></label>
        <label>Motion
          <select data-key="ring1.mode">
            <option value="front">Static in front of the person</option>
            <option value="orbit">Orbit around the body</option>
          </select>
        </label>
        <div class="row">
          <label>Face <input type="color" data-key="ring1.color" /></label>
          <label>Edge <input type="color" data-key="ring1.edge" /></label>
          <label>Italic <input type="checkbox" data-key="ring1.italic" /></label>
        </div>
        <label>Height on body <input type="range" min="-1.8" max="1.4" step="0.05" data-key="ring1.height" /></label>
        <label>Radius <input type="range" min="0.6" max="2.2" step="0.05" data-key="ring1.radius" /></label>
        <label>Letter size <input type="range" min="0.12" max="0.6" step="0.01" data-key="ring1.size" /></label>
        <label>Spin speed <input type="range" min="-3" max="3" step="0.05" data-key="ring1.speed" /></label>
      </fieldset>

      <fieldset>
        <legend><label><input type="checkbox" data-key="ring2.enabled" /> Second text ring</label></legend>
        <label>Text <input type="text" data-key="ring2.text" maxlength="40" /></label>
        <label>Motion
          <select data-key="ring2.mode">
            <option value="front">Static in front of the person</option>
            <option value="orbit">Orbit around the body</option>
          </select>
        </label>
        <div class="row">
          <label>Face <input type="color" data-key="ring2.color" /></label>
          <label>Edge <input type="color" data-key="ring2.edge" /></label>
          <label>Italic <input type="checkbox" data-key="ring2.italic" /></label>
        </div>
        <label>Height on body <input type="range" min="-1.8" max="1.4" step="0.05" data-key="ring2.height" /></label>
        <label>Radius <input type="range" min="0.6" max="2.2" step="0.05" data-key="ring2.radius" /></label>
        <label>Letter size <input type="range" min="0.12" max="0.6" step="0.01" data-key="ring2.size" /></label>
        <label>Spin speed <input type="range" min="-3" max="3" step="0.05" data-key="ring2.speed" /></label>
      </fieldset>

      <fieldset>
        <legend><label><input type="checkbox" data-key="badge.enabled" /> Orbiting logo / badge</label></legend>
        <label>Badge text (used when no logo uploaded) <input type="text" data-key="badge.text" maxlength="16" /></label>
        <label>Motion
          <select data-key="badge.mode">
            <option value="front">Still, in front of the person</option>
            <option value="orbit">Orbit around the body</option>
          </select>
        </label>
        <label class="file">Upload logo (PNG with transparency) <input id="logoInput" type="file" accept="image/*" /></label>
        <button id="btnClearLogo" class="btn-ghost" type="button">Remove uploaded logo</button>
        <label>Count <input type="range" min="1" max="6" step="1" data-key="badge.count" /></label>
        <label>Height on body <input type="range" min="-1.8" max="1.6" step="0.05" data-key="badge.height" /></label>
        <label>Radius <input type="range" min="0.6" max="2.5" step="0.05" data-key="badge.radius" /></label>
        <label>Size <input type="range" min="0.2" max="1.4" step="0.02" data-key="badge.size" /></label>
        <label>Spin speed <input type="range" min="-3" max="3" step="0.05" data-key="badge.speed" /></label>
      </fieldset>

      <fieldset>
        <legend>Effects</legend>
        <label class="check"><input type="checkbox" data-key="fx.stream" /> 3D capsules &amp; cubes rising around the person</label>
        <label>3D objects
          <select data-key="fx.streamStyle">
            <option value="both">Capsules + cubes</option>
            <option value="capsules">Glass capsules</option>
            <option value="cubes">Glass cubes (blue + green)</option>
          </select>
        </label>
        <label class="check"><input type="checkbox" data-key="fx.fireworks" /> Fireworks in background</label>
        <label class="check"><input type="checkbox" data-key="fx.fountains" /> Sparkler fountains at feet</label>
        <label class="check"><input type="checkbox" data-key="fx.glitter" /> Glitter around main ring</label>
        <label class="check"><input type="checkbox" data-key="occlusion" /> Person occlusion (text passes behind body)</label>
      </fieldset>

      <fieldset>
        <legend>Camera &amp; tracking</legend>
        <p id="arCheck" class="muted ar-check"></p>
        <label class="check"><input type="checkbox" data-key="arLock" /> Lock uses AR world lock (ARCore, Android)</label>
        <label>Ring tilt <input type="range" min="-0.4" max="0.8" step="0.01" data-key="tilt" /></label>
        <label class="check"><input type="checkbox" data-key="invertGyro" /> Invert 360° gyro direction</label>
        <label class="check"><input type="checkbox" data-key="mic" /> Record sound with the video (microphone)</label>
        <label>Body tracking model
          <select data-key="model">
            <option value="lite">Lite (fast, phones)</option>
            <option value="full">Full (steadier)</option>
          </select>
        </label>
        <label>Person cut-out quality
          <select data-key="mask">
            <option value="fast">Fast (250 KB model)</option>
            <option value="hq">High quality (16 MB model)</option>
          </select>
        </label>
        <label>3D font
          <select data-key="font">
            <option value="helvetiker_bold">Helvetiker Bold</option>
            <option value="optimer_bold">Optimer Bold</option>
            <option value="gentilis_bold">Gentilis Bold</option>
          </select>
        </label>
      </fieldset>
      <button id="btnReset" class="btn-ghost" type="button">Reset to defaults</button>
    </div>
  </aside>

  <!-- Result modal -->
  <section id="result" class="overlay brand-bg hidden">
    <div class="result-card">
      <img class="result-logo" src="./brand/logo.webp" alt="Gut Synbio" />
      <div class="result-body">
        <video id="resultVideo" playsinline controls loop></video>
        <img id="resultImage" alt="Captured photo" class="hidden" />
        <!-- after Submit: upload progress, then a QR code the guest scans to download the video -->
        <div id="uploadPanel" class="upload-panel hidden" aria-live="polite">
          <div id="uploadProgress" class="upload-progress">
            <div class="progress-track"><span id="uploadBar"></span></div>
            <p id="uploadStatus">Uploading…</p>
          </div>
          <div id="qrBox" class="qr-box hidden">
            <img id="qrImg" alt="QR code: scan to download your video" />
            <p class="qr-caption">Scan to download<br />your video</p>
          </div>
        </div>
      </div>
      <div class="result-actions">
        <button id="btnSubmit" class="btn-primary" type="button">Submit</button>
        <a id="btnDownload" class="btn-primary" download>Download</a>
        <button id="btnCloseResult" class="btn-ghost" type="button">Retake</button>
      </div>
      <p id="resultInfo" class="muted"></p>
    </div>
  </section>

  <div id="toast" class="toast"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
